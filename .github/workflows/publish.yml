name: publish

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Package version, for example 4.0.2 or 4.1.0-rc.1. Must match the csproj version. Required unless the workflow runs from a tag.
        required: false
        type: string

permissions:
  # Create the GitHub release for the tag.
  contents: write
  # Required for NuGet trusted publishing: lets the job request a GitHub OIDC token.
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: src/Bleess.Extensions.Logging.File/Bleess.Extensions.Logging.File.csproj
  PACKAGE_ID: Bleess.Extensions.Logging.File

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SourceLink needs the commit history to embed the right source links.
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            raw="$INPUT_VERSION"
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            raw="$GITHUB_REF_NAME"
          else
            echo "::error::A version input is required when the workflow is not started from a tag."
            exit 1
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid SemVer package version."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Verify release metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          actual="$(dotnet msbuild "$PROJECT" -getProperty:PackageVersion)"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::Package version mismatch: $PROJECT declares $actual but this release is $VERSION. Update VersionPrefix/VersionSuffix before tagging."
            exit 1
          fi
          echo "Project version $actual matches the release."

          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          echo "Found the $VERSION changelog entry."

      - name: Restore
        run: dotnet restore Bleess.Extensions.Logging.File.slnx

      - name: Build
        run: dotnet build Bleess.Extensions.Logging.File.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack "$PROJECT" -c Release --no-build -o artifacts

      - name: Verify package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          package="artifacts/${PACKAGE_ID}.${VERSION}.nupkg"
          if [[ ! -f "$package" ]]; then
            echo "::error::Expected package '$package' was not produced."
            ls -l artifacts
            exit 1
          fi
          echo "Created $package"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login (OIDC exchange for a short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          # nuget.org profile name, not an email address.
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ -z "${NUGET_API_KEY:-}" ]]; then
            echo "::error::NuGet login did not return an API key. Check the trusted publishing policy and the NUGET_USER secret."
            exit 1
          fi

          dotnet nuget push "artifacts/${PACKAGE_ID}.${VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Extract release notes
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::The $VERSION changelog section produced no release notes."
            exit 1
          fi

      - name: Create GitHub release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          else
            prerelease=()
          fi

          if gh release view "$TAG" > /dev/null 2>&1; then
            # A previous run already created the release; refresh it and replace the package asset.
            gh release edit "$TAG" \
              --title "$VERSION" \
              --notes-file release-notes.md \
              "${prerelease[@]}"
            gh release upload "$TAG" artifacts/*.nupkg --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg \
              --verify-tag \
              --title "$VERSION" \
              --notes-file release-notes.md \
              "${prerelease[@]}"
          fi
