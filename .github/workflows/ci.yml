name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore Bleess.Extensions.Logging.File.slnx

      - name: Build
        run: dotnet build Bleess.Extensions.Logging.File.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Bleess.Extensions.Logging.File/Bleess.Extensions.Logging.File.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*
